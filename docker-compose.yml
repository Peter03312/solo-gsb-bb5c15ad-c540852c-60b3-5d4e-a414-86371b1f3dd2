services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: timer
      POSTGRES_PASSWORD: timer
      POSTGRES_DB: race_timer
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 仅在数据卷为空（首次初始化）时自动执行
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timer -d race_timer"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://timer:timer@db:5432/race_timer
    ports:
      - "8000:8000"

volumes:
  pgdata:
